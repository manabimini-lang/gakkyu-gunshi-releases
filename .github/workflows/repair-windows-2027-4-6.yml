name: Repair Windows 2027.4.6 package

on:
  push:
    paths:
      - .github/workflows/repair-windows-2027-4-6.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repack-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Download and update the published ZIP
        env:
          ARCHIVE: GakkyuGunshi-2027.4.6-Windows-x64.zip
          RELEASE_URL: https://github.com/manabimini-lang/gakkyu-gunshi-releases/releases/download/v2027.4.6/GakkyuGunshi-2027.4.6-Windows-x64.zip
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-all-errors --output "$ARCHIVE" "$RELEASE_URL"
          python3 - <<'PY'
          import hashlib
          import json
          import zipfile
          from pathlib import Path

          archive = Path("GakkyuGunshi-2027.4.6-Windows-x64.zip")
          command_name = "GakkyuGunshi/保存先を変更する.cmd"
          manifest_name = "GakkyuGunshi/release-manifest.json"
          command = (
              b"@echo off\r\n"
              b"setlocal\r\n"
              b"\"%~dp0GakkyuGunshi.exe\" --configure-storage\r\n"
              b"if errorlevel 1 pause\r\n"
              b"endlocal\r\n"
          )

          with zipfile.ZipFile(archive, "a", compression=zipfile.ZIP_DEFLATED) as package:
              latest = {}
              for item in package.infolist():
                  if not item.is_dir():
                      latest[item.filename] = item

              old_manifest = json.loads(package.read(latest[manifest_name]).decode("utf-8"))
              files = []
              for filename in sorted(latest):
                  if filename == manifest_name:
                      continue
                  payload = package.read(latest[filename])
                  files.append({
                      "path": filename,
                      "sha256": hashlib.sha256(payload).hexdigest(),
                      "size": len(payload),
                  })
              files.append({
                  "path": command_name,
                  "sha256": hashlib.sha256(command).hexdigest(),
                  "size": len(command),
              })
              old_manifest["files"] = sorted(files, key=lambda item: item["path"])
              package.writestr(command_name, command, compress_type=zipfile.ZIP_DEFLATED)
              package.writestr(
                  manifest_name,
                  json.dumps(old_manifest, ensure_ascii=False, indent=2).encode("utf-8") + b"\n",
                  compress_type=zipfile.ZIP_DEFLATED,
              )

          with zipfile.ZipFile(archive) as package:
              if package.testzip() is not None:
                  raise SystemExit("ZIP integrity check failed")
              command_text = package.read(command_name).decode("utf-8")
              if "--configure-storage" not in command_text:
                  raise SystemExit("Storage change launcher was not packaged")
              manifest = json.loads(package.read(manifest_name).decode("utf-8"))
              for item in manifest["files"]:
                  payload = package.read(item["path"])
                  if len(payload) != item["size"] or hashlib.sha256(payload).hexdigest() != item["sha256"]:
                      raise SystemExit(f"Manifest mismatch: {item['path']}")
          PY
          sha256sum "$ARCHIVE" > SHA256SUMS.txt

      - name: Replace the release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload v2027.4.6 GakkyuGunshi-2027.4.6-Windows-x64.zip SHA256SUMS.txt --clobber
          cat > release-notes.md <<'EOF'
          Windows x64版（v2027.4.6）です。

          本体ZIPには、NAS・USB起動を使っている場合でも保存先を指定し直せる `保存先を変更する.cmd` を同梱しています。実行すると保存先を選び、通常起動用の設定を更新します。

          すでに旧ZIPをダウンロード済みの方は、`GakkyuGunshi-2027.4.6-storage-change-patch.zip` を展開して、同名ファイルをアプリフォルダへ追加してください。
          EOF
          gh release edit v2027.4.6 --notes-file release-notes.md
